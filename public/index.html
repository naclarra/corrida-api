<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LARGADA · Gestão de corridas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="mark">
        <span class="bib-num">42</span>
      </div>
      <div>
        <h1>LARGADA</h1>
        <p class="subtitle">Sistema de gestão de corridas de rua</p>
      </div>
    </div>
    <nav class="nav">
      <a href="#" data-view="provas" class="nav-link active">Provas</a>
      <a href="#" data-view="corredores" class="nav-link">Corredores</a>
      <span class="auth-area">
        <span id="user-info" class="user-info hidden"></span>
        <button id="btn-login" class="btn btn-ghost">Entrar</button>
        <button id="btn-logout" class="btn btn-ghost hidden">Sair</button>
      </span>
    </nav>
  </header>

  <main id="app" class="container">
    <!-- Conteúdo dinâmico injetado aqui -->
  </main>

  <div id="toast-container" class="toast-container"></div>

  <!-- Modal de login/registro -->
  <div id="auth-modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">×</button>
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Entrar</button>
        <button class="auth-tab" data-tab="register">Criar conta</button>
      </div>

      <form id="form-login" class="auth-form">
        <h2>Acesso ao sistema</h2>
        <label>Email
          <input type="email" name="email" required />
        </label>
        <label>Senha
          <input type="password" name="senha" required minlength="6" />
        </label>
        <button type="submit" class="btn btn-primary">Entrar</button>
      </form>

      <form id="form-register" class="auth-form hidden">
        <h2>Criar conta</h2>
        <label>Nome
          <input type="text" name="nome" required />
        </label>
        <label>Email
          <input type="email" name="email" required />
        </label>
        <label>Senha
          <input type="password" name="senha" required minlength="6" />
        </label>
        <label>Perfil
          <select name="perfil">
            <option value="usuario">Usuário</option>
            <option value="admin">Administrador</option>
          </select>
        </label>
        <button type="submit" class="btn btn-primary">Criar conta</button>
      </form>
    </div>
  </div>

  <footer class="footer">
    <span>LARGADA · 2026</span>
    <a href="/swagger" target="_blank">Documentação Swagger →</a>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
